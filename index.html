<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한진 대리점 수수료 계산기</title>
    <style>
        /* 간단한 UI 스타일링 (작업 중이신 화면과 유사하게 구성) */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; padding: 20px; }
        .calculator-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #e9ecef; }
        .tab-btn.active { background: #3b82f6; color: white; }
        .tab-btn.active.delivery { background: #10b981; } /* 배송 탭은 초록색 예시 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-calc { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #3b82f6; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-calc.delivery { background: #10b981; }
        .result-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 5px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .result-title { font-weight: bold; font-size: 16px; }
        .result-value { font-size: 20px; font-weight: bold; color: #dc2626; }
        .notice-box { background: #f0fdf4; border-left: 4px solid #10b981; padding: 15px; margin-top: 20px; font-size: 13px; color: #1e293b; line-height: 1.6; }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="tabs">
        <button class="tab-btn active" id="tab-pickup" onclick="switchTab('pickup')">📦 집하 계산</button>
        <button class="tab-btn" id="tab-delivery" onclick="switchTab('delivery')">🚛 배송 계산</button>
        <button class="tab-btn" id="tab-return" onclick="switchTab('return')">🔄 반품 계산</button>
    </div>

    <div id="calculator-form">
        <div class="form-group" id="type-select-group">
            <label id="type-label">타입 (선불 / 신용)</label>
            <select id="type_select" class="form-control" onchange="handleTypeChange()">
                <option value="선불">선불</option>
                <option value="신용">신용</option>
            </select>
        </div>

        <div class="form-group">
            <label id="fare-label">집하 운임 입력 (원)</label>
            <input type="number" id="calc_fare" class="form-control" placeholder="예: 3000" oninput="autoCalculate()">
        </div>

        <button type="button" id="btn-submit" class="btn-calc" onclick="executeCalculation()">계산하기</button>
    </div>

    <div class="result-box">
        <span class="result-title" id="result-title-text">예상 집하 수수료</span>
        <div id="result_value_box">
            <span id="out_result">0</span> 원
        </div>
    </div>

    <div class="notice-box" id="notice-content">
        💡 일반적으로는 총운임 - 사회적합의비용(170원) 기준으로 금액 구간별 수수료 발생하여 정산되나, 기타 비용 추가 발생 시 예상 수수료보다 실제 수수료가 낮을 수 있습니다.
    </div>
</div>

<script>
    // [설정] B급지 고정 변수
    const fixedRegion = 'B';

    // 현재 활성화된 탭 상태 ('pickup', 'delivery', 'return')
    let currentTab = 'pickup';

    // 1. 탭 전환 로직
    function switchTab(tab) {
        currentTab = tab;
        
        // 버튼 스타일 토글
        document.getElementById('tab-pickup').classList.remove('active', 'delivery');
        document.getElementById('tab-delivery').classList.remove('active', 'delivery');
        document.getElementById('tab-return').classList.remove('active', 'delivery');
        
        const activeTabBtn = document.getElementById(`tab-${tab}`);
        activeTabBtn.classList.add('active');
        
        const submitBtn = document.getElementById('btn-submit');

        // 탭별 UI 레이아웃 동적 변경
        if (tab === 'pickup') {
            submitBtn.classList.remove('delivery');
            submitBtn.innerText = '계산하기';
            document.getElementById('type-label').innerText = '타입 (선불 / 신용)';
            document.getElementById('fare-label').innerText = '집하 운임 입력 (원)';
            document.getElementById('result-title-text').innerText = '예상 집하 수수료';
            
            // 집하에 맞는 셀렉트 박스 옵션 구성
            document.getElementById('type_select').innerHTML = `
                <option value="선불">선불</option>
                <option value="신용">신용</option>
            `;
        } else if (tab === 'delivery') {
            submitBtn.classList.add('delivery');
            submitBtn.innerText = '계산하기';
            document.getElementById('type-label').innerText = '운임 구분';
            document.getElementById('fare-label').innerText = '배송 운임 입력 (원)';
            document.getElementById('result-title-text').innerText = '예상 배송 수수료';
            
            // 배송에 맞는 셀렉트 박스 옵션 구성
            document.getElementById('type_select').innerHTML = `
                <option value="일반선착불">일반선착불</option>
                <option value="착지신용">착지신용</option>
            `;
        }
        
        // 탭이 바뀔 때는 수수료 결과만 초기화 (운임 입력값은 유지 가능)
        resetResultOnly();
        // 탭 전환 후 바로 자동 계산 처리
        autoCalculate();
    }

    // 2. [핵심 수정] 구분/타입 변경 시 실행되는 함수
    function handleTypeChange() {
        // 수수료 결과창 UI만 리셋합니다.
        resetResultOnly();
        
        // 짚어주신 주범이었던 변수 초기화 라인(value = '')을 제거하여 운임 입력값이 그대로 유지됩니다!
        // 토글 변경과 동시에 즉시 실시간 계산을 돌립니다.
        autoCalculate();
    }

    // 결과창만 0원으로 리셋하는 공통 함수
    function resetResultOnly() {
        document.getElementById('out_result').innerText = '0';
        document.getElementById('result_value_box').innerHTML = '<span id="out_result">0</span> 원';
    }

    // 3. 값이 입력되거나 토글이 바뀔 때 실시간 자동 계산 함수
    function autoCalculate() {
        const fareValue = document.getElementById('calc_fare').value;
        // 입력 값이 없거나 빈 문자열이면 계산 안 하고 0원으로 둠
        if (!fareValue || fareValue.trim() === "") {
            resetResultOnly();
            return;
        }
        executeCalculation();
    }

    // 4. 실제 계산 실행 컨트롤러
    function executeCalculation() {
        const fareInput = document.getElementById('calc_fare').value;
        const baseFare = parseInt(fareInput, 10);
        if (isNaN(baseFare)) return;

        const selectedType = document.getElementById('type_select').value;
        let finalFee = 0;

        if (currentTab === 'pickup') {
            // 집하 계산 호출 (B타입 고정 전송)
            finalFee = calculate_pickup_fee(selectedType, fixedRegion, baseFare);
        } else if (currentTab === 'delivery') {
            // 배송 계산 호출 (B타입 고정 전송)
            finalFee = calculate_delivery_fee(selectedType, fixedRegion, baseFare);
        }

        // 화면에 최종 수수료 금액 반영 (천단위 콤마 추가)
        document.getElementById('out_result').innerText = finalFee.toLocaleString();
    }

    // 5. [로직] 집하 수수료 계산 함수 (기존 테이블 연동 규칙)
    function calculate_pickup_fee(type, region, baseFare) {
        // 예시 요율 테이블 매핑 (실제 데이터에 맞게 내부 조건 조정 가능)
        // region 변수는 항상 'B'로 들어옵니다.
        let fee = 0;
        
        // 사회적합의비용 차감 등 대리점 요율 정산 공식 구현부
        // 아래는 간단한 예시 공식이며, 기존에 사용하시던 find_pickup_rate 알고리즘을 대입하시면 됩니다.
        if (type === '선불') {
            fee = Math.floor((baseFare - 170) * 0.11); // 선불 B급지 예시 요율 11%
        } else if (type === '신용') {
            fee = Math.floor((baseFare - 170) * 0.09); // 신용 B급지 예시 요율 9%
        }
        
        return fee < 0 ? 0 : fee;
    }

    // 6. [로직] 배송 수수료 계산 함수
    function calculate_delivery_fee(type, region, baseFare) {
        let fee = 0;
        // 배송 계산 시 기존과 동일하게 B급지 단가 기준 94% 원단위 절사 등 규칙 적용
        if (type === '일반선착불') {
            fee = Math.floor((baseFare - 170) * 0.94);
        } else if (type === '착지신용') {
            fee = Math.floor((baseFare - 170) * 0.05); // 착지신용 예시 (5%)
        }
        return fee < 0 ? 0 : fee;
    }
</script>

</body>
</html>
